name: vela-build

on:
  push:
    branches:
      - build

env:
  BUILD_VERSION: "13.0.3"
  VELA_VERSION: "v0.1.0"
  IMAGE_NAME: ghcr.io/mengkzhaoyun/vela

jobs:
  build-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Vela Builder Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.drone/dockerfile.build
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.VELA_VERSION }}-build
          build-args: |
            BASE=nvidia/cuda:${{ env.BUILD_VERSION }}-devel-ubuntu24.04

      - name: Build complete
        run: echo "Builder image ${{ env.IMAGE_NAME }}:${{ env.VELA_VERSION }}-build pushed successfully to GHCR!"

