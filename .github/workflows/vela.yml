name: vela

on:
  workflow_dispatch:
  push:
    branches:
      - release
  workflow_run:
    workflows: ["vela-build"]
    types:
      - completed

env:
  BUILD_VERSION: "13.0.3"
  VELA_VERSION: "v0.1.0"
  ALIYUN_IMAGE_NAME: registry.cn-qingdao.aliyuncs.com/wod/cuda
  GHCR_IMAGE_NAME: ghcr.io/mengkzhaoyun/vela

jobs:
  vela-runtime:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Build and push vela runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .drone/dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ALIYUN_IMAGE_NAME }}:${{ env.BUILD_VERSION }}-vela-${{ env.VELA_VERSION }}
          build-args: |
            BASE=${{ env.GHCR_IMAGE_NAME }}:${{ env.VELA_VERSION }}-build
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ env.BUILD_VERSION }}-vela-${{ env.VELA_VERSION }}

      - name: Build complete
        run: echo "CUDA ${{ env.BUILD_VERSION }}-vela-${{ env.VELA_VERSION }} pushed successfully to Aliyun!"

